[package]
name = "zk-mint-input"
authors = [ "Tim Clancy <tim-clancy.eth>" ]
license = "LicenseRef-VPL WITH AGPL-3.0-only"
version = "0.1.0"
edition = "2024"
description = "A tool to generate zero knowledge minting circuit input."

[dependencies]
alloy = { version = "1", features = ["full"] }
ark-bn254 = "0.5"
ark-ff = { version = "0.5", features = ["std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
rand = "0.9"
eyre = "0.6"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa-core", "sha256"] }
toml = "0.8"
taceo-poseidon2 = "0.2"
