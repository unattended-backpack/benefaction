[profile.default]
src = "src"
script = "script"
out = "out"
libs = ["dependencies"]
optimizer = true
optimizer_runs = 200

#
solc = "0.8.26"
verbosity = 2
ffi = true
fs_permissions = [
  { access = "read-write", path = ".forge-snapshots" },
  { access = "read", path = "script/" },
]
extra_output = ["storageLayout"]

# Map standard import paths to Soldeer locations.
remappings = [
  "forge-std/=dependencies/forge-std-1.14.0/src/",
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.0-rc.0/",
  "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.6.0-rc.0/",
  "openzeppelin-contracts/contracts/=dependencies/@openzeppelin-contracts-5.6.0-rc.0/",
  "solady/=dependencies/solady-0.1.26/src/",
  "permit2/=dependencies/uniswap-permit2-unlocked-1.0.0/",
  "v4-periphery/=dependencies/uniswap-v4-periphery-3779387e5d296f39df543d23524b050f89a62917/",
  "@uniswap/v4-core/=dependencies/uniswap-v4-core-4/",
  "forge-gas-snapshot/=dependencies/forge-gas-snapshot-0.0.4/src/",
  "continuous-clearing-auction/=src/",
  "test/=test/",
  "btt/=test/btt/",
]

[profile.default.fuzz]
runs = 2500

[profile.default.invariant]
fail_on_revert = true
runs = 100
depth = 2500

[profile.pr.fuzz]
runs = 5000

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
fail_on_revert = true
runs = 100
depth = 2500

[profile.debug]
via_ir = false
optimizer_runs = 200
fuzz.runs = 100

# Dependencies (installed via `forge soldeer install`).
[dependencies]
forge-std = "1.14.0"
solady = "0.1.26"
"@openzeppelin-contracts" = "5.6.0-rc.0"
"@openzeppelin-contracts-upgradeable" = "5.6.0-rc.0"
uniswap-permit2-unlocked = "1.0.0"
uniswap-v4-periphery = "3779387e5d296f39df543d23524b050f89a62917"
forge-gas-snapshot = "0.0.4"
uniswap-v4-core = "4"
