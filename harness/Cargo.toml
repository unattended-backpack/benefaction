[package]
name = "zk-mint-harness"
authors = [ "Tim Clancy <tim-clancy.eth>" ]
license = "LicenseRef-VPL WITH AGPL-3.0-only"
version = "0.1.0"
edition = "2024"
description = "A harness for testing the zero knowledge minting circuit."

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
eyre = "0.6"
hex = "0.4"
ark-bn254 = "0.5"
ark-ff = { version = "0.5", features = ["std"] }
taceo-poseidon2 = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
